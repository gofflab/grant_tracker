{% extends "base.html" %}{% load gt %}
{% block title %}{{ form_title }}{% endblock %}
{% block content %}
<div class="page-head"><div class="titles"><h1>{{ form_title }}</h1></div></div>
<div class="card" style="max-width:{% if modal_size == 'wide' %}960px{% else %}760px{% endif %}">
  <form method="post" action="{{ request.get_full_path }}" {% if multipart %}enctype="multipart/form-data"{% endif %}>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="card-body">{% block form_body %}{% endblock %}</div>
    <div class="form-actions" style="padding:14px 16px;margin:0">
      {% block form_actions %}
      <a class="btn ghost" href="{{ cancel_url }}">Cancel</a>
      <button type="submit" class="btn primary">{{ submit_label }}</button>
      {% endblock %}
    </div>
  </form>
</div>
{% endblock %}
