{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><div class="titles"><div class="crumbs"><a href="{% url 'accounts:user_list' %}">Users</a></div><h1>{{ title }}</h1></div></div>
<div class="card" style="max-width:720px"><div class="card-body">
<form method="post" class="form-grid">{% csrf_token %}
  {% include "_form_errors.html" %}
  {% for field in form %}{% include "_field.html" with field=field %}{% endfor %}
  <div class="field span-12"><div class="row"><button class="btn primary" type="submit">Save</button><a class="btn ghost" href="{% url 'accounts:user_list' %}">Cancel</a></div></div>
</form>
</div></div>
{% endblock %}
