{% extends "accounts/_auth_base.html" %}
{% block title %}Reset password{% endblock %}
{% block auth %}
<h1 style="font-size:18px;margin-bottom:6px">Reset password</h1>
<p class="muted">We'll email a reset link if the address matches an account.</p>
<form method="post" class="form-grid">{% csrf_token %}
  {% include "_field.html" with field=form.email span="span-12" %}
  <div class="field span-12"><button class="btn primary" type="submit" style="width:100%">Send reset link</button></div>
</form>
<p class="small mt-2 mb-0" style="text-align:center"><a href="{% url 'accounts:login' %}">Back to sign in</a></p>
{% endblock %}
