{% load gt %}<div class="modal-backdrop">
  <div class="modal {{ modal_size }}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <form method="post" action="{{ request.get_full_path }}" hx-post="{{ request.get_full_path }}" hx-target="#modal"
          {% if multipart %}enctype="multipart/form-data" hx-encoding="multipart/form-data"{% endif %}>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="modal-head">
        <h2 id="modal-title">{{ form_title }}</h2>
        <button type="button" class="btn ghost icon-only" data-close-modal aria-label="Close">{% icon 'x' 18 %}</button>
      </div>
      <div class="modal-body">{% block form_body %}{% endblock %}</div>
      <div class="form-actions">
        {% block form_actions %}
        <button type="button" class="btn ghost" data-close-modal>Cancel</button>
        <button type="submit" class="btn primary {% if danger %}danger{% endif %}">{{ submit_label }}</button>
        {% endblock %}
      </div>
    </form>
  </div>
</div>
